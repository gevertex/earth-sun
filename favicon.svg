<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="100%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="60%" stop-color="#0c1526"/>
      <stop offset="100%" stop-color="#060a13"/>
    </radialGradient>
    <linearGradient id="day" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fc6f5"/>
      <stop offset="55%" stop-color="#2f7cc4"/>
      <stop offset="100%" stop-color="#1d5fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffd97a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="globeClip"><circle cx="33" cy="35" r="16.5"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <circle cx="52" cy="10" r="1" fill="#9db4d8" opacity="0.65"/>
  <circle cx="57.5" cy="44" r="0.8" fill="#9db4d8" opacity="0.5"/>
  <circle cx="9" cy="47" r="0.9" fill="#9db4d8" opacity="0.55"/>
  <circle cx="47" cy="56" r="0.7" fill="#9db4d8" opacity="0.45"/>

  <!-- orbit, passing behind the globe -->
  <ellipse cx="33" cy="35" rx="23" ry="8.5" transform="rotate(-22 33 35)" fill="none" stroke="#6fd3ff" stroke-width="1.2" opacity="0.5"/>

  <!-- sun -->
  <circle cx="13" cy="13" r="9.5" fill="url(#glow)"/>
  <circle cx="13" cy="13" r="4.2" fill="#ffecb0"/>

  <!-- globe: day side, night crescent, sun path -->
  <circle cx="33" cy="35" r="16.5" fill="url(#day)"/>
  <g clip-path="url(#globeClip)">
    <path d="M 21 24.5 C 23 22 27.5 22.5 28 25 C 28.5 27.5 25 29 22.5 28 C 20.5 27 20 25.5 21 24.5 Z" fill="#4fae72" opacity="0.9"/>
    <path d="M 18 38 C 20 36 24 37 24.5 40 C 25 43 21 44.5 19 42.5 C 17.5 41 17 39 18 38 Z" fill="#4fae72" opacity="0.85"/>
    <path d="M 33 18.5 A 16.5 16.5 0 0 1 33 51.5 C 45 44.5 45 25.5 33 18.5 Z" fill="#0d1a30"/>
    <circle cx="43.5" cy="30" r="0.8" fill="#ffd27a" opacity="0.9"/>
    <circle cx="46" cy="35.5" r="0.9" fill="#ffd27a" opacity="0.8"/>
    <circle cx="43" cy="40.5" r="0.7" fill="#ffd27a" opacity="0.85"/>
    <path d="M 18 44 Q 24 28 34.5 20.4" fill="none" stroke="#ffb347" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
    <path d="M 25.13 30.1 Q 29.25 24.2 34.5 20.4" fill="none" stroke="#6fd3ff" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
    <circle cx="25.13" cy="30.1" r="1.7" fill="#ffd24a"/>
  </g>

  <!-- satellite on the orbit -->
  <circle cx="54.3" cy="26.4" r="1.6" fill="#6fd3ff"/>
</svg>
