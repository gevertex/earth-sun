<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earth · real-time sun position</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; }
  #readout {
    position: fixed; top: 16px; left: 16px;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe8ff; background: rgba(8, 14, 26, 0.72);
    border: 1px solid rgba(120, 170, 255, 0.25);
    border-radius: 8px; padding: 10px 14px;
    pointer-events: none; min-width: 250px;
  }
  #readout .title { color: #fff; font-weight: 600; margin-bottom: 4px; }
  #readout .dim { color: #7f97b8; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font: 12px/1.4 system-ui, sans-serif; color: #6d84a3;
    pointer-events: none;
  }
  #sat-tip {
    position: fixed; top: 0; left: 0; display: none; z-index: 10;
    pointer-events: none; white-space: nowrap;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe8ff; background: rgba(8, 14, 26, 0.92);
    border: 1px solid rgba(120, 170, 255, 0.4);
    border-radius: 6px; padding: 5px 9px;
  }
  #sat-tip .name { color: #fff; font-weight: 600; }
  #sat-tip .dim { color: #7f97b8; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "satellite.js": "https://unpkg.com/satellite.js@5.0.0/dist/satellite.es.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="readout">
  <div class="title">Subsolar point (where the Sun is overhead)</div>
  <div>UTC <span id="utc">--:--:--</span></div>
  <div>Latitude <span id="lat">--</span></div>
  <div>Longitude <span id="lon">--</span></div>
  <div>Solar declination <span id="dec">--</span></div>
  <div class="dim">Equation of time <span id="eot">--</span> min</div>
  <div class="dim" style="margin-top:6px">Sun path, this time of day:<br><span style="color:#ffb347">━ past</span> &nbsp;·&nbsp; <span style="color:#6fd3ff">━ future</span> &nbsp;(1 yr)</div>
  <div class="dim" style="margin-top:6px">Satellites, real orbits (hover a dot):<br><span style="color:#6fd3ff">● LEO</span> &nbsp;·&nbsp; <span style="color:#9dff6f">● MEO</span> &nbsp;·&nbsp; <span style="color:#ff6fb3">● GEO</span></div>
  <div class="dim">TLE data <span id="tle">--</span></div>
</div>
<div id="sat-tip"></div>
<div id="hint">drag to rotate · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const DEG = Math.PI / 180;
const R = 10; // globe radius

/* ---------- solar position (low-precision, Meeus/NOAA style) ---------- */

function julianDate(d) { return d.getTime() / 86400000 + 2440587.5; }

function dayOfYear(d) {
  const start = Date.UTC(d.getUTCFullYear(), 0, 0);
  return (d.getTime() - start) / 86400000;
}

// Point on Earth where the Sun is directly overhead, from the current time.
function subSolarPoint(d) {
  const T = (julianDate(d) - 2451545.0) / 36525.0;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T; // mean longitude, deg
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;  // mean anomaly, deg
  const Mr = M * DEG;
  const lambda = L0 + 1.91460 * Math.sin(Mr) + 0.02 * Math.sin(2 * Mr); // ecliptic longitude, deg
  const eps = (23.439 - 0.0000004 * T) * DEG; // obliquity of the ecliptic
  const decl = Math.asin(Math.sin(eps) * Math.sin(lambda * DEG)) / DEG;

  // Equation of time (minutes, sundial minus clock), low-precision fit.
  const B = (360 * (dayOfYear(d) - 81)) / 364 * DEG;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);

  // The Sun is overhead where apparent local time is 12:00.
  const h = d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
  let lon = 15 * (12 - h) - 15 * eot / 60;
  lon = ((lon % 360) + 540) % 360 - 180; // normalize to [-180, 180)
  return { latDeg: decl, lonDeg: lon, eotMin: eot };
}

// lat/lon (deg) -> vector. Matches the default THREE.SphereGeometry UV
// mapping for an equirectangular texture (u=0 at 180°W).
function latLonToVec3(latDeg, lonDeg, radius) {
  const lat = latDeg * DEG, lon = lonDeg * DEG;
  return new THREE.Vector3(
    radius * Math.cos(lat) * Math.cos(lon),
    radius * Math.sin(lat),
    -radius * Math.cos(lat) * Math.sin(lon),
  );
}

/* ---------- scene ---------- */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 12;
controls.maxDistance = 120;

// Starfield: random points on a distant shell.
{
  const n = 2500;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(500 + Math.random() * 300);
    pos.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xbcc8dd, size: 1.1, sizeAttenuation: false, transparent: true, opacity: 0.8,
  })));
}

// Globe: plain blue until the texture arrives, so the page works offline.
// High segment count so the terrain displacement stays smooth.
// uSunDir (view space) gates the city-light emissive to the night side.
const uSunDir = { value: new THREE.Vector3(0, 0, 1) };
const globeMat = new THREE.MeshPhongMaterial({ color: 0x1d3f8f, shininess: 8 });
globeMat.onBeforeCompile = (shader) => {
  shader.uniforms.uSunDir = uSunDir;
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform vec3 uSunDir;')
    .replace(
      '#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n' +
        '\tfloat nightFactor = smoothstep(0.12, -0.12, dot(normalize(vNormal), uSunDir));\n' +
        '\ttotalEmissiveRadiance *= nightFactor;'
    );
};
const globe = new THREE.Mesh(new THREE.SphereGeometry(R, 256, 256), globeMat);
scene.add(globe);
new THREE.TextureLoader().load(
  'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
  (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    globeMat.map = tex;
    globeMat.color.set(0xffffff);
    globeMat.needsUpdate = true;
  },
  undefined,
  () => {}, // keep the fallback color
);

// City lights: a satellite night-lights map as an emissive map. It glows where
// humans live, brighter where more people live; the shader patch above keeps
// it visible only on the night side.
new THREE.TextureLoader().load(
  'https://unpkg.com/three-globe/example/img/earth-night.jpg',
  (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    globeMat.emissiveMap = tex;
    globeMat.emissive.set(0xffffff);
    globeMat.emissiveIntensity = 2.5;
    globeMat.needsUpdate = true;
  },
  undefined,
  () => {}, // offline: no city lights
);

// 3D terrain: an elevation map displaces the surface and adds fine relief as a
// bump map. The subsolar marker samples the same map so it sits on the terrain.
const DISPLACEMENT = 0.6;
let hData = null, hW = 0, hH = 0;
new THREE.TextureLoader().load(
  'https://unpkg.com/three-globe/example/img/earth-topology.png',
  (tex) => {
    globeMat.displacementMap = tex;
    globeMat.displacementScale = DISPLACEMENT;
    globeMat.bumpMap = tex;
    globeMat.bumpScale = 0.05;
    globeMat.needsUpdate = true;
    const img = tex.image;
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    hData = ctx.getImageData(0, 0, img.width, img.height).data;
    hW = img.width;
    hH = img.height;
  },
  undefined,
  () => {}, // offline: keep a smooth globe
);

// Surface radius at a texture coordinate (u right, v up).
function surfaceRadiusAt(u, v) {
  if (!hData) return R;
  const x = Math.min(hW - 1, Math.max(0, Math.floor(u * hW)));
  const y = Math.min(hH - 1, Math.max(0, Math.floor((1 - v) * hH)));
  return R + (hData[(y * hW + x) * 4] / 255) * DISPLACEMENT;
}

// Sun: small sphere + the directional light that creates the day/night terminator.
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1.6, 24, 24),
  new THREE.MeshBasicMaterial({ color: 0xffe28a }),
);
scene.add(sunMesh);
const sunLight = new THREE.DirectionalLight(0xfff2d8, 4.5);
scene.add(sunLight);
// Very low fill: enough to keep the night side faintly readable, dark enough
// that the day/night terminator stays a crisp, visible edge.
scene.add(new THREE.AmbientLight(0x8899bb, 0.05));

// Subsolar marker: a dot on the surface plus a line from the center.
const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffd24a }),
);
scene.add(marker);
const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const centerLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffd24a, transparent: true, opacity: 0.55 }));
scene.add(centerLine);

// Sun path: where the subsolar point was (past) and will be (future) at this
// time of day, over a full year. Two lines meet at the current marker.
const PATH_DAYS = 365;
const pathMat = {
  past: new LineMaterial({ color: 0xffb347, linewidth: 2.5, transparent: true, opacity: 0.9 }),
  future: new LineMaterial({ color: 0x6fd3ff, linewidth: 2.5, transparent: true, opacity: 0.9 }),
};
for (const m of Object.values(pathMat)) m.resolution.set(innerWidth, innerHeight);
const pathGeo = { past: new LineGeometry(), future: new LineGeometry() };
const pathLine = {
  past: new Line2(pathGeo.past, pathMat.past),
  future: new Line2(pathGeo.future, pathMat.future),
};
scene.add(pathLine.past, pathLine.future);

function buildSunPath(now) {
  const half = Math.floor(PATH_DAYS / 2);
  const past = [], future = [];
  const sample = (arr, k) => {
    const { latDeg, lonDeg } = subSolarPoint(new Date(now.getTime() + k * 86400000));
    const r = surfaceRadiusAt((lonDeg + 180) / 360, (latDeg + 90) / 180) + 0.1;
    arr.push(latLonToVec3(latDeg, lonDeg, r).toArray());
  };
  for (let k = -half; k <= 0; k++) sample(past, k);
  for (let k = 0; k <= half; k++) sample(future, k);
  pathGeo.past.setPositions(past.flat());
  pathGeo.future.setPositions(future.flat());
  pathLine.past.computeLineDistances();
  pathLine.future.computeLineDistances();
}

/* ---------- satellites: real orbits via SGP4 (satellite.js) ---------- */
// Loaded dynamically so a CDN failure only disables satellites, not the globe.
const sat = await import('satellite.js').catch(() => null);

const EARTH_RADIUS_KM = 6371;
const KM_TO_SCENE = R / EARTH_RADIUS_KM;

// Real satellites: name, NORAD catalog number, and a fallback TLE (epoch 2026-08).
// Fresh TLEs are fetched from Celestrak on load; the fallback keeps orbits working
// if the fetch fails.
const SATELLITES = [
  { name: 'ISS (ZARYA)', catnr: 25544, line1: '1 25544U 98067A   26234.50053383  .00009133  00000+0  17025-3 0  9997', line2: '2 25544  51.6331 331.8814 0007668  72.6488 287.5339 15.49570248582031' },
  { name: 'CSS (TIANHE)', catnr: 48274, line1: '1 48274U 21035A   26234.46683157  .00014340  00000+0  18184-3 0  9999', line2: '2 48274  41.4688 279.6646 0001556 255.0784 104.9883 15.59157790303510' },
  { name: 'HUBBLE', catnr: 20580, line1: '1 20580U 90037B   26234.62763700  .00005984  00000+0  18408-3 0  9991', line2: '2 20580  28.4738 346.2416 0002063 150.3073 209.7640 15.31421310798761' },
  { name: 'NOAA 19', catnr: 33591, line1: '1 33591U 09005A   26234.58969731  .00000005  00000+0  26610-4 0  9993', line2: '2 33591  98.9474 305.4971 0013475 198.3441 161.7247 14.13482941903864' },
  { name: 'SENTINEL-2A', catnr: 40697, line1: '1 40697U 15028A   26234.64824256  .00001698  00000+0  66441-3 0  9993', line2: '2 40697  98.5642 308.5426 0001446  83.6589 276.4758 14.30817207583237' },
  { name: 'JASON-3', catnr: 41240, line1: '1 41240U 16002A   26234.64351578 -.00000043  00000+0  77213-4 0  9997', line2: '2 41240  66.0446 346.1162 0008296 267.4347  92.5722 12.87626358495801' },
  { name: 'TERRA', catnr: 25994, line1: '1 25994U 99068A   26234.60019697  .00000275  00000+0  64813-4 0  9995', line2: '2 25994  97.9406 281.4964 0003021  47.3925 112.8934 14.61146993419305' },
  { name: 'AQUA', catnr: 27424, line1: '1 27424U 02022A   26234.66015816  .00000614  00000+0  13188-3 0  9999', line2: '2 27424  98.4347 205.2938 0001811  85.9128  87.8197 14.62173921292985' },
  { name: 'STARLINK-1008', catnr: 44714, line1: '1 44714U 19074B   26234.17284867  .00077595  00000+0  89842-3 0  9997', line2: '2 44714  53.1481 110.2629 0005172  75.9267 284.2321 15.61165912374481' },
  { name: 'GPS BIIR-5 (PRN 22)', catnr: 26407, line1: '1 26407U 00040A   26233.86206892  .00000056  00000+0  00000+0 0  9999', line2: '2 26407  54.8436 212.5546 0119276 303.3328 239.9019  2.00558243191265' },
  { name: 'GALILEO (GSAT0101)', catnr: 37846, line1: '1 37846U 11060A   26231.78617055 -.00000108  00000+0  00000+0 0  9997', line2: '2 37846  56.9695 340.0379 0001315  73.5474 286.4867  1.70475811 92204' },
  { name: 'GOES-16', catnr: 41866, line1: '1 41866U 16071A   26234.60200672 -.00000093  00000+0  00000+0 0  9991', line2: '2 41866   0.4971  84.9997 0001247 103.6337 254.2661  1.00273212 35766' },
];

// Orbit regime by altitude: LEO < 2000 km, MEO 2000-35000 km, GEO above.
const TYPE_COLOR = { LEO: 0x6fd3ff, MEO: 0x9dff6f, GEO: 0xff6fb3 };
function orbitType(altKm) {
  if (altKm < 2000) return 'LEO';
  if (altKm < 35000) return 'MEO';
  return 'GEO';
}

// ECI position (km) -> group-local coords. The group is rotated by -GMST each
// frame, which turns these inertial points into the Earth-fixed view.
function eciToLocal(p) {
  return new THREE.Vector3(p.x, p.z, -p.y).multiplyScalar(KM_TO_SCENE);
}

const satWorld = new THREE.Group();
scene.add(satWorld);
const dotGeo = new THREE.SphereGeometry(0.3, 12, 12);
const hitGeo = new THREE.SphereGeometry(1.1, 8, 8);
const sats = [];            // { name, satrec, dot, hit, line, lineMat, type, baseOpacity }
const orbitMats = [];       // orbit LineMaterials, for resolution updates on resize
const raycastTargets = [];  // hit meshes, for hover
let hovered = null;         // the satellite under the cursor, if any

function clearSatellites() {
  for (const s of sats) {
    satWorld.remove(s.dot, s.hit, s.line);
    s.dot.material.dispose();
    s.hit.material.dispose();
    s.line.geometry.dispose();
    s.lineMat.dispose();
  }
  sats.length = 0;
  orbitMats.length = 0;
  raycastTargets.length = 0;
  hovered = null;
  // A rebuild can happen while the cursor is on a dot: hide the stale tooltip.
  document.getElementById('sat-tip').style.display = 'none';
  document.body.style.cursor = '';
}

function buildSatellites() {
  if (!sat) return;
  clearSatellites();
  const now = new Date();
  for (const def of SATELLITES) {
    let rec;
    try { rec = sat.twoline2satrec(def.line1, def.line2); }
    catch { continue; }
    const pv = sat.propagate(rec, now);
    if (!pv || !pv.position) continue;

    const altKm = eciToLocal(pv.position).length() / KM_TO_SCENE - EARTH_RADIUS_KM;
    const type = orbitType(altKm);
    const color = TYPE_COLOR[type];

    // Visible dot plus a larger invisible hover target, in group-local coords.
    const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color }));
    dot.position.copy(eciToLocal(pv.position));
    const hit = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));
    hit.position.copy(dot.position);

    // Orbit path: one full period in the inertial frame, a closed ellipse.
    const periodMin = (2 * Math.PI) / rec.no;
    const N = 180;
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = new Date(now.getTime() + (i / N) * periodMin * 60000);
      const pp = sat.propagate(rec, t);
      if (pp && pp.position) pts.push(eciToLocal(pp.position).toArray());
    }
    const geo = new LineGeometry();
    geo.setPositions(pts.flat());
    const lineMat = new LineMaterial({ color, linewidth: 1.4, transparent: true, opacity: 0.45 });
    lineMat.resolution.set(innerWidth, innerHeight);
    const line = new Line2(geo, lineMat);
    line.computeLineDistances();

    satWorld.add(dot, hit, line);
    orbitMats.push(lineMat);
    raycastTargets.push(hit);
    const s = { name: def.name, satrec: rec, dot, hit, line, lineMat, type, baseOpacity: 0.45 };
    dot.userData.sat = s;
    hit.userData.sat = s;
    sats.push(s);
  }
}

// Fetch fresh TLEs from Celestrak and rebuild. Falls back to the embedded TLEs.
// Runs on load and every TLE_REFRESH_MS while the app runs, so the orbit
// elements stay current in a long session.
const TLE_REFRESH_MS = 5 * 60 * 1000;
let tleRefreshing = false;
let tleLive = false;      // true once a fetch has succeeded
let lastTleUpdate = 0;    // ms timestamp of the last successful fetch

async function refreshTles() {
  if (!sat || tleRefreshing) return;
  tleRefreshing = true;
  const results = await Promise.all(SATELLITES.map(async (def) => {
    try {
      const r = await fetch(`https://celestrak.org/NORAD/elements/gp.php?CATNR=${def.catnr}&FORMAT=tle`);
      if (!r.ok) return null;
      const lines = (await r.text()).split('\n').map((l) => l.trim()).filter(Boolean);
      const l1 = lines.find((l) => l.startsWith('1 '));
      const l2 = lines.find((l) => l.startsWith('2 '));
      return l1 && l2 ? { line1: l1, line2: l2 } : null;
    } catch { return null; }
  }));
  tleRefreshing = false;
  let fetched = 0, changed = false;
  results.forEach((res, i) => {
    if (!res) return;
    fetched++;
    if (res.line1 !== SATELLITES[i].line1 || res.line2 !== SATELLITES[i].line2) changed = true;
    SATELLITES[i].line1 = res.line1;
    SATELLITES[i].line2 = res.line2;
  });
  if (changed) buildSatellites();
  if (fetched > 0) { tleLive = true; lastTleUpdate = Date.now(); }
}

buildSatellites();
refreshTles();
// Live updates: re-fetch while the app runs, and catch up when the tab
// returns to view (background tabs throttle timers).
setInterval(refreshTles, TLE_REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastTleUpdate > TLE_REFRESH_MS) refreshTles();
});

/* ---------- readout + animation ---------- */

const $ = (id) => document.getElementById(id);
const fmtLat = (v) => `${Math.abs(v).toFixed(2)}° ${v >= 0 ? 'N' : 'S'}`;
const fmtLon = (v) => `${Math.abs(v).toFixed(2)}° ${v >= 0 ? 'E' : 'W'}`;

const tmpMat = new THREE.Matrix4();
let lastPathSecond = -1;

function tick() {
  const now = new Date();
  const { latDeg, lonDeg, eotMin } = subSolarPoint(now);
  const dir = latLonToVec3(latDeg, lonDeg, 1);

  // Sun direction in view space, for the night-side city-light mask.
  camera.updateMatrixWorld();
  tmpMat.copy(camera.matrixWorld).invert();
  uSunDir.value.copy(dir).transformDirection(tmpMat);

  // Float the marker just above the local terrain height.
  const surfR = surfaceRadiusAt((lonDeg + 180) / 360, (latDeg + 90) / 180);
  marker.position.copy(dir).multiplyScalar(surfR + 0.12);
  sunMesh.position.copy(dir).multiplyScalar(70);
  sunLight.position.copy(dir).multiplyScalar(50);
  lineGeo.setFromPoints([new THREE.Vector3(), dir.clone().multiplyScalar(surfR)]);

  // Rebuild the sun path once per second; it shifts slowly with the time of day.
  if (now.getUTCSeconds() !== lastPathSecond) {
    lastPathSecond = now.getUTCSeconds();
    buildSunPath(now);
  }

  // Move each satellite along its orbit; rotate the group to the Earth-fixed view.
  if (sat) {
    satWorld.rotation.y = -sat.gstime(now);
    for (const s of sats) {
      const pv = sat.propagate(s.satrec, now);
      if (pv && pv.position) {
        const p = eciToLocal(pv.position);
        s.dot.position.copy(p);
        s.hit.position.copy(p);
      }
    }
  }

  $('utc').textContent = now.toISOString().slice(11, 19);
  $('lat').textContent = fmtLat(latDeg);
  $('lon').textContent = fmtLon(lonDeg);
  $('dec').textContent = `${latDeg >= 0 ? '+' : ''}${latDeg.toFixed(2)}°`;
  $('eot').textContent = `${eotMin >= 0 ? '+' : ''}${eotMin.toFixed(1)}`;
  $('tle').textContent = !sat ? 'satellite.js failed to load'
    : tleRefreshing ? 'updating…'
    : tleLive ? `updated ${new Date(lastTleUpdate).toISOString().slice(11, 19)} UTC`
    : 'embedded fallback';

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  for (const m of Object.values(pathMat)) m.resolution.set(innerWidth, innerHeight);
  for (const m of orbitMats) m.resolution.set(innerWidth, innerHeight);
});

/* ---------- hover: show the satellite name under the cursor ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const satTip = document.getElementById('sat-tip');

function setHover(s) {
  if (s === hovered) return;
  if (hovered) {
    hovered.dot.scale.setScalar(1);
    hovered.lineMat.opacity = hovered.baseOpacity;
  }
  hovered = s;
  if (hovered) {
    hovered.dot.scale.setScalar(2);
    hovered.lineMat.opacity = 0.9;
  }
}

addEventListener('pointermove', (e) => {
  if (!sat || raycastTargets.length === 0) { setHover(null); satTip.style.display = 'none'; return; }
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(raycastTargets, false);
  const s = hits.length ? hits[0].object.userData.sat : null;
  setHover(s);
  if (s) {
    satTip.style.display = 'block';
    satTip.style.left = (e.clientX + 14) + 'px';
    satTip.style.top = (e.clientY + 14) + 'px';
    satTip.innerHTML = `<span class="name">${s.name}</span><br><span class="dim">${s.type}</span>`;
    document.body.style.cursor = 'pointer';
  } else {
    satTip.style.display = 'none';
    document.body.style.cursor = '';
  }
});
</script>
</body>
</html>
